<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<nav>
        <div class="logo">
            <img src="4615221.png" alt="">
            <h6>Our School</h6>
        </div>
        <div class="links">
            <a href="">Home </a>
            <a href="">Activites</a>
            <a href="blog.html">Blog</a>
            <a href="">About</a>
            <a href="">Login</a>
        </div>
        <div class="setting">
            <img src="free-search-icon-957-thumb.png" alt="">
            <img src="settings-icon-symbol-design-illustration-vector.jpg" alt="">
        </div>
    </nav>
    <header class="re">
        <img src="calendar-icon-free-vector.jpg" alt="">
        <h2>Register & Booking</h2>
        <p>Fill in the details below to register or book your place.</p>
    </header>
    <form class="or">
        <div class="d">
            <h6>Personal Information</h6>
            <p>Full Name</p>
            <input type="text" placeholder="Enter your name">
            <p>Email Address</p>
            <input type="email" placeholder="Enter your email">
            <p>Phone Number</p>
            <input type="tel" placeholder="Enter your phone">
        </div>
        <div class="B">
            <h6>Booking Details</h6>
            <p>Courses/Activity</p>
            <select name="Courses" id="c">
                <option value="programing">programing</option>
                <option value="AI">AI</option>
                <option value="Digital Art">Digital Art</option>
                <option value="Telecom">Telecom</option>
                <option value="Network">Network</option>
            </select>
            <p>Date</p>
            <input type="date" placeholder="Select your date">
            <p>Massage (Optional)</p>
            <textarea name="text" placeholder="Type your massage"></textarea>
        </div>
        <div class="but">
        <button>submit</button></div>
    </form>
</body>
</html>
